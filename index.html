<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Project</title>

    <!-- CDNJS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
   
    <!-- CSS -->
    <link rel="stylesheet" href="Stylr.css">
    
    </head>
    
    <body>
        <nav class="navbar store-navbar sticky-top">
            <div class="container">
                <a class="navbar-brand" href="#home">Guest Book</a>
                <ul class="nav">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">About Us</a>
                    </li>
                </ul>
            </div>
        </nav>
        
        <main>
            <section class="guestbook-section" id="home">
                <div class="container">
                    <div class="row g-4">

                        <!-- Form Leave Message -->
                        <div class="col-lg-4">
                            <div class="card shadow-sm">
                                <div class="card-header bg-primary text-white">
                                    <h5 class="mb-0">Leave Message</h5>
                                </div>

                                <div class="card-body">
                                    <form id="guest-form">
                                        <div class="form-group mb-3">
                                            <label for="name" class="form-label">Full Name</label>
                                            <input id="name" type="text" class="form-control" placeholder="Enter your full name" required>
                                        </div>

                                        <div class="form-group mb-3">
                                            <label for="massage" class="form-label">Message</label>
                                            <textarea id="message" name="message" class="form-control" rows="5"
                                                placeholder="Write your message here" required></textarea>
                                        </div>

                                        <button type="submit" class="btn btn-primary w-100">
                                            Submit Message
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>

                        <!-- New Messages -->
                        <div class="col-lg-8">
                            <div class="messages-container">
                                <h5>New Messages</h5>
                                <hr>

                               <!-- Pesan ketika belum ada data -->
                                <p id="emptyMessage" class="text-muted text-center">
                                    No new messages yet.
                                </p>

                                <!-- Tempat kartu pesan -->
                                <ul id="messageList"
                                    class="row row-cols-1 row-cols-md-2 g-3 list-unstyled">
                                </ul>
                            </div>
                        </div>

                    </div>
                </div>
            </section>
        </main>

        <footer class="store-footer">
            <div class="container text-center">

                <h6>Connect with Us</h6>

                <div class="social-links">
                    <a href="#" aria-label="LinkedIn">
                        <i class="fa-brands fa-linkedin"></i>
                    </a>

                    <a href="#" aria-label="X">
                        <i class="fa-brands fa-x-twitter"></i>
                    </a>

                    <a href="#" aria-label="Instagram">
                        <i class="fa-brands fa-instagram"></i>
                    </a>

                    <a href="#" aria-label="GitHub">
                        <i class="fa-brands fa-github"></i>
                    </a>
                </div>

                <p class="copyright">
                    &copy; 2026 Interactive Guest Book.
                    All rights reserved.
                </p>

            </div>
        </footer>

    <script src="Javascript.js"></script>    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    </body>
    
    </html>
